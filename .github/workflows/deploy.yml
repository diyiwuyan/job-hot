name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run hourly from 07:00-19:00 Beijing time (UTC-8: 23,0-11)
    - cron: '0 23,0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch data from sources
        run: |
          npx tsx scripts/parse-campus2026.ts
          npx tsx scripts/parse-campus-shame.ts
          npx tsx scripts/parse-nowcoder.ts
          npx tsx scripts/parse-deepoffer.ts
          npx tsx scripts/parse-guopin.ts
          npx tsx scripts/parse-yingjiesheng.ts
          npx tsx scripts/generate-pages.ts
      - name: Commit updated data (accumulate entries across builds)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/nowcoder-data.json src/lib/deepoffer-data.json src/lib/guopin-data.json src/lib/yingjiesheng-data.json
          git diff --cached --quiet || git commit -m "chore: update recruitment data [skip ci]"
          git push || true

      - name: Match subscriptions
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/match-subscriptions.ts

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx next build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Add 404.html SPA fallback
        run: cp ./out/index.html ./out/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
